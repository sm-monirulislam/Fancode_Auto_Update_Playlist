name: FanCode Auto Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fancode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch Python Script from Private Repo
        env:
          REPO_NAME: ${{ secrets.SECRET_REPO_NAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:${GH_PAT}@github.com/sm-monirulislam/${REPO_NAME}.git private_code
          cp private_code/scripts/fancode_sm.py ./
          rm -rf private_code

      - name: Run FanCode Script
        run: |
          python fancode_sm.py

      - name: Show Generated Files
        run: |
          echo "Generated files:"
          ls -lh fancode_data.json fancode_bd.m3u

      - name: Clean Up Python Script
        run: |
          rm -f fancode_sm.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fancode_data.json fancode_bd.m3u

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "🔁 Auto update FanCode playlist"
            git push origin HEAD
          fi
